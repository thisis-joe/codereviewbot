version: 1
repositories:
  - platform: github
    instance: https://api.github.com
    repository: your-org/your-repo
    botLogin: hey[bot]
    webhookSecretEnv: GITHUB_WEBHOOK_SECRET
    webhookAuth: hmac
    # Recommended: set tokenEnv to "", configure a GitHub App in .env.
    # For a dedicated bot PAT, set tokenEnv and botLogin to that bot's identity.
    tokenEnv: GITHUB_TOKEN
    enabled: false
  - platform: gitlab
    instance: https://gitlab.com
    repository: your-group/your-project
    botLogin: your-hey-user
    webhookSecretEnv: GITLAB_WEBHOOK_SECRET
    webhookAuth: signing
    tokenEnv: GITLAB_TOKEN
    # Optional: concise MR/comment and completed-question notifications to this repository's MM channel.
    # Store the full incoming webhook URL only in .env; keep it out of this file.
    # mattermostWebhookEnv: MATTERMOST_WEBHOOK_URL
    # mattermostChannel: your-channel
    enabled: false
