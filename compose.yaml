# Keep the deployed project identity so existing volumes and networks are reused.
name: codereviewbot
x-storage-logging: &storage-logging
  driver: local
  options:
    max-size: "5m"
    max-file: "2"
    compress: "true"
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    logging: *storage-logging
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs}
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:?Run setup}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Run setup}
    # initdb pins timezone in postgresql.conf, so the TZ env alone does not move an existing cluster.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "timezone=${TZ:-Asia/Seoul}", "-c", "log_timezone=${TZ:-Asia/Seoul}"]
    volumes:
      - database:/var/lib/postgresql/data
      - ./ops/init-db.sh:/docker-entrypoint-initdb.d/10-hey.sh:ro
    networks: [control]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  runner:
    build: { context: ., target: runner }
    image: hey-runner:0.1.0
    restart: unless-stopped
    logging: *storage-logging
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Run setup}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-codex}
      CODEX_HOME: /codex
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_BASE_URL: ${CODEX_BASE_URL:-}
      CLAUDE_CONFIG_DIR: /claude
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      DATA_ROOT: /data
    volumes:
      - snapshots:/data/jobs:ro
      - codex-auth:/codex
      - claude-auth:/claude
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    networks: [runner-rpc, runner-egress]
    cpus: 2
    mem_limit: 2g
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  controller:
    build: { context: ., target: controller }
    image: hey-controller:0.1.0
    restart: unless-stopped
    logging: *storage-logging
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      DATABASE_URL: postgres://reviewbot:${BOT_DB_PASSWORD}@postgres:5432/reviewbot
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run setup}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Run setup}
      RUNNER_URL: http://runner:8091
      REPOSITORIES_FILE: /config/repositories.yaml
      DATA_ROOT: /data
      N8N_WAKE_URL: http://n8n:5678/webhook/review-wakeup
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
    volumes:
      - ./config/repositories.yaml:/config/repositories.yaml:ro
      - ./.local/secrets/github-app.pem:/run/secrets/github-app.pem:ro
      - git-cache:/data/cache
      - snapshots:/data/jobs
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    networks: [control, runner-rpc, controller-egress]
    ports: ["127.0.0.1:${CONTROLLER_PORT:-18092}:8092"]
    mem_limit: 768m
    depends_on:
      postgres: { condition: service_healthy }
      runner: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    restart: unless-stopped
    logging: *storage-logging
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_POOL_SIZE: 5
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run setup}
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_MAX_AGE: 48
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 500
    volumes: [n8n-state:/home/node/.n8n]
    ports: ["127.0.0.1:${N8N_PORT:-5688}:5678"]
    networks: [control, n8n-ui]
    mem_limit: 768m
    depends_on:
      postgres: { condition: service_healthy }
      controller: { condition: service_healthy }

  tunnel:
    image: cloudflare/cloudflared:2026.5.0
    profiles: [tunnel]
    restart: unless-stopped
    logging: *storage-logging
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "--no-autoupdate", "run"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./.local/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./.local/secrets/tunnel.json:/run/secrets/tunnel.json:ro
    networks: [control, tunnel-egress]
    depends_on:
      controller: { condition: service_healthy }

volumes:
  database:
  snapshots:
  git-cache:
  codex-auth:
  claude-auth:
  n8n-state:
networks:
  control: { internal: true }
  runner-rpc: { internal: true }
  controller-egress:
  runner-egress:
  n8n-ui:
  tunnel-egress:
